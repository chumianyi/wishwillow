name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List build outputs
        run: ls -la app/build/outputs/apk/release/

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/许愿柳-v1.0.0-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wishwillow-release-apk
          path: app/build/outputs/apk/release/许愿柳-v1.0.0-arm64-v8a.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: 许愿柳 v1.0.0
          body: |
            ## 许愿柳 Wish Willow v1.0.0
            
            - Three.js 3D WebGL 渲染
            - Neumorphism 新拟态 UI
            - arm64-v8a 单架构
            - 最低支持 Android 7.0 (API 24)
          files: |
            app/build/outputs/apk/release/许愿柳-v1.0.0-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
